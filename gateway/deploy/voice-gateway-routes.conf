# Only these two exact routes bypass dashboard BasicAuth. POST requires a
# scoped device bearer in the backend. No cookies; browser redirects forbidden.
location = /dictation-bridge/healthz {
    auth_basic off;
    access_log off;
    proxy_pass http://127.0.0.1:8897/healthz;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
location = /dictation-bridge/v1/transcribe {
    auth_basic off;
    access_log off;
    # Suppress request-related proxy diagnostics; service exposes safe codes.
    error_log /dev/null crit;
    client_max_body_size 7m;
    client_body_buffer_size 8m;
    client_body_timeout 15s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 110s;
    proxy_send_timeout 30s;
    proxy_pass http://127.0.0.1:8897/v1/transcribe;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($request_method = OPTIONS) { return 204; }
}
